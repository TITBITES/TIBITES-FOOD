run:
  timeout: 3m
  tests: true
linters:
  enable:
    - govet
    - staticcheck
    - gosimple
    - errcheck
    - ineffassign
    - unused
    - gocyclo
  disable:
    - depguard
linters-settings:
  gocyclo:
    min-complexity: 15
issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
